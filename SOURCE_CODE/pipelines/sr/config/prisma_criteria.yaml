# Sample review criteria. The launcher replaces this file from the PICO step.
# If you run the SR pipeline directly, replace every <...> first;
# the run stops while any <...> remain.
# Worked example: reference/sr_cbt_fibromyalgia/prisma_criteria.yaml
review_title: "<Review title, e.g. Effect of X on Y>"
effect_measure: SMD        # SMD, MD, OR or RR
pico:
  population:   "<e.g. Adults with condition X>"
  intervention: "<e.g. Treatment X>"
  comparator:   "<e.g. Placebo, usual care or waiting list>"
  outcome:      "<e.g. Symptom score at post intervention>"
inclusion_criteria:
  - RCT
  - Adult participants
exclusion_criteria:
  - Non-RCT
  - Animal studies
