name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
          OPENAI_API_KEY: dummy-ci-key
          DEEPSEEK_API_KEY: dummy-ci-key
          GROQ_API_KEY: dummy-ci-key
          DASHSCOPE_API_KEY: dummy-ci-key
          OLLAMA_HOST: http://localhost:11434
          DEFAULT_PROVIDER: deepseek
        run: |
          python -m pytest -m "not live" --tb=short -q

      - name: Coverage report
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
          OPENAI_API_KEY: dummy-ci-key
          DEEPSEEK_API_KEY: dummy-ci-key
          GROQ_API_KEY: dummy-ci-key
          DASHSCOPE_API_KEY: dummy-ci-key
          OLLAMA_HOST: http://localhost:11434
          DEFAULT_PROVIDER: deepseek
        run: |
          python -m pytest -m "not live" --cov=SOURCE_CODE --cov-report=term-missing -q
