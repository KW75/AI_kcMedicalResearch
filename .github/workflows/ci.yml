name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check for UTF-8 BOMs
        run: python scripts/check_no_bom.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
          OPENAI_API_KEY: dummy-ci-key
          DEEPSEEK_API_KEY: dummy-ci-key
          GROQ_API_KEY: dummy-ci-key
          DASHSCOPE_API_KEY: dummy-ci-key
          OLLAMA_HOST: http://localhost:11434
          DEFAULT_PROVIDER: deepseek
        run: |
          python -m pytest -m "not live" --tb=short -q

      - name: Coverage report
        if: success()
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
          OPENAI_API_KEY: dummy-ci-key
          DEEPSEEK_API_KEY: dummy-ci-key
          GROQ_API_KEY: dummy-ci-key
          DASHSCOPE_API_KEY: dummy-ci-key
          OLLAMA_HOST: http://localhost:11434
          DEFAULT_PROVIDER: deepseek
        run: |
          python -m pytest -m "not live" --cov=SOURCE_CODE --cov-report=term-missing -q

  test-local-pins:
    # Installs exactly what the Windows and macOS launchers install
    # (requirements-local.txt), without extra build tools, so a broken or
    # floating pin fails here before a colleague hits it (Session 34: httpx).
    # tests/test_ci_matches_launchers.py keeps this in step with the launchers.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install like the launchers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt

      - name: Check installed packages agree
        run: python -m pip check

      - name: Record installed versions
        run: python -m pip freeze

      - name: Install test tools
        run: python -m pip install pytest

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
          OPENAI_API_KEY: dummy-ci-key
          DEEPSEEK_API_KEY: dummy-ci-key
          GROQ_API_KEY: dummy-ci-key
          DASHSCOPE_API_KEY: dummy-ci-key
          OLLAMA_HOST: http://localhost:11434
          DEFAULT_PROVIDER: deepseek
        run: |
          python -m pytest -m "not live" --tb=short -q
