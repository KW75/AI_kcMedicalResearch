"Arthritis Care Research - 2010 - Ang - Cognitive behavioral therapy attenuates nociceptive responding in patients with-1.pdf":
  first_author: Ang
  year: 2010
  exclude_from_meta: "clinical pain (FIQ pain) reported only as Week 6 change scores; Table 2 values are the NFR pain rating"
  note: >-
    Not pooled (reviewer decision, Session 38, option B). Table 2 (-20.2 +/- 23.9
