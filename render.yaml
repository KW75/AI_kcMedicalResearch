services:
  - type: web
    name: ai-kcmedicalresearch
    runtime: python
    repo: https://github.com/KW75/AI_kcMedicalResearch
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements-render.txt
    startCommand: |
      streamlit run SOURCE_CODE/ui/app.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: true
      - key: STREAMLIT_SERVER_PORT
        value: $PORT
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1